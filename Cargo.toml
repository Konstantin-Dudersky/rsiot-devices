[package]
name = "rsiot-devices"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "*"
bitvec = "1.0.1"
rsiot = { version = "*", path = "/mnt/data/projects/rsiot/", features = [
    "executor",
] }
strum = { version = "*", features = ["derive"] }
tracing = "*"
tokio = "*"
anyhow = "*"

[dev-dependencies]
tokio = { version = "*", features = ["rt-multi-thread"] }
serde = { version = "*", features = ["derive"] }
rsiot = { version = "*", path = "/mnt/data/projects/rsiot/", features = [
    "log_console",
    "cmp_linux_i2c_master",
    "cmp_linux_spi_master",
    "cmp_timescaledb",
] }
